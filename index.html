</nav>

function _budgetColor(b){
  if(b.remaining===0) return {bg:'bg-red-100',text:'text-red-700',bar:'bg-red-500',pulse:'pulse-soft'};
  if(b.remaining < b.alertCritical) return {bg:'bg-red-50',text:'text-red-700',bar:'bg-red-500',pulse:'pulse-soft'};
  if(b.remaining < b.alertLow) return {bg:'bg-yellow-50',text:'text-yellow-700',bar:'bg-yellow-400',pulse:'pulse-soft'};
  return {bg:'bg-green-50',text:'text-green-700',bar:'bg-green-500',pulse:''};
}
function renderBudgetWidget(){
  const totalFunded = STATE.adsBudgets.reduce((s,b)=>s+b.total,0);
  const totalUsed = STATE.adsBudgets.reduce((s,b)=>s+b.used,0);
  const totalRemaining = STATE.adsBudgets.reduce((s,b)=>s+b.remaining,0);
  let html = '<div class="bg-white rounded-xl shadow-sm p-4"><h3 class="font-bold text-sm mb-3 flex items-center gap-2">💰 Ads Budget — alle Plattformen</h3>';
  html += '<div class="grid grid-cols-2 md:grid-cols-3 gap-2">';
  STATE.adsBudgets.forEach(b=>{
    const c = _budgetColor(b);
    const pct = b.total>0 ? Math.min(100,(b.used/b.total)*100) : 0;
    const dot = b.remaining===0?'🔴':b.remaining<b.alertCritical?'🔴':b.remaining<b.alertLow?'🟡':'🟢';
    html += '<div class="border rounded-lg p-2 ' + c.bg + ' ' + c.pulse + '" style="border-left:4px solid ' + b.color + '">';
    html += '<div class="flex justify-between items-start mb-1"><div class="font-bold text-xs">' + b.icon + ' ' + b.name + '</div>' + (b.remaining===0?'<span class="text-[9px] bg-red-600 text-white px-1 rounded font-bold">STOPPED</span>':'') + '</div>';
    html += '<div class="text-[10px] ' + c.text + '">Total: CHF ' + b.total + ' · Verbleibend: CHF ' + b.remaining + ' ' + dot + '</div>';
    html += '<div class="h-1.5 bg-slate-200 rounded-full overflow-hidden my-1"><div class="' + c.bar + ' h-full" style="width:' + pct + '%"></div></div>';
    html += '<div class="text-[10px] text-slate-600">⚠️ ' + b.warning + '</div>';
    // AUFGABE 6: Auto-Refill switch
    html += '<label class="flex items-center gap-1 text-[10px] mt-1 cursor-pointer"><input type="checkbox" ' + (b.autoRefill?'checked':'') + ' onchange="toggleAutoRefill(\''+b.id+'\',this.checked)"> Auto-Refill</label>';
    html += '<div class="flex gap-1 mt-1"><button onclick="topupAdsBudget(\''+b.id+'\')" class="flex-1 text-[10px] bg-emerald-600 text-white py-1 rounded font-medium">Aufladen ↗</button>';
    html += '<button onclick="window.open(\''+b.url+'\',\'_blank\')" class="flex-1 text-[10px] bg-slate-600 text-white py-1 rounded font-medium">Öffnen</button></div>';
    html += '</div>';
  });
  html += '</div>';
  html += '<div class="mt-3 pt-3 border-t text-xs text-center"><b>Total Funded:</b> CHF ' + totalFunded + ' · <b>Used:</b> CHF ' + totalUsed + ' · <b>Verfügbar:</b> CHF ' + totalRemaining + '</div>';
  html += '</div>';
  return html;
}

function toggleAutoRefill(id, on){
  const b = STATE.adsBudgets.find(x=>x.id===id);
  if(!b) return;
  b.autoRefill = !!on;
  save();
  toast('Auto-Refill ' + (on?'AN':'AUS') + ' für ' + b.name);
  // Trigger check
  if(on && b.remaining < b.alertCritical){
    setTimeout(()=>autoRefillCheck(id), 300);
  }
}

function autoRefillCheck(id){
  const b = STATE.adsBudgets.find(x=>x.id===id);
  if(!b || !b.autoRefill) return;
  if(b.remaining >= b.alertCritical) return;
  const choice = prompt('Auto-Refill: Budget unter CHF ' + b.alertCritical + ' für ' + b.name + '.\nSoll ich CHF ' + b.autoRefillAmount + ' nachladen?\n1 = Ja, jetzt\n2 = Nein\n3 = Werbung pausieren');
  if(choice==='1'){
    b.total += b.autoRefillAmount;
    b.remaining = b.total - b.used;
    save();render();
    toast('💰 CHF ' + b.autoRefillAmount + ' nachgeladen');
    logActivity('Auto-Refill: +CHF ' + b.autoRefillAmount + ' (' + b.name + ')','dollar-sign');
  } else if(choice==='3'){
    b.status='paused';
    save();render();
    toast('⏸ ' + b.name + ' pausiert');
  }
}

function topupAdsBudget(id){
  const b = STATE.adsBudgets.find(x=>x.id===id);
  if(!b) return;
  const amt = prompt('Wie viel CHF aufladen für ' + b.name + '?', '100');
  const n = parseFloat(amt);
  if(isNaN(n) || n<=0) return;
  b.total += n;
  b.remaining = b.total - b.used;
  save();render();
  toast('💰 CHF ' + n + ' zu ' + b.name + ' hinzugefügt');
  logActivity('Budget +CHF ' + n + ' (' + b.name + ')','dollar-sign');
}

async function generateKI(pid,count){
const p=STATE.products.find(x=>x.id===pid);
if(!p) return;
ensureImgArrays(p);
count = count || 3;
if(!STATE.keys.openai){
toast("⚠️ Kein OpenAI Key — bitte in Setup ⚙️ eintragen");
openSetup(); return;
}
const costPer = 0.04;
const cost = (count*costPer).toFixed(2);
if(!confirm("DALL·E 3: "+count+" Bild(er) für "+p.t+"\n≈ $"+cost+" Kosten. Fortfahren?")) return;
toast("🎨 Generiere "+count+" Bild(er) via DALL·E 3…");
logActivity("KI-Gen Start: "+count+" für "+p.t,"sparkles");
let ok=0, fail=0;
for(let i=0;i<count;i++){
if(p.gallery.length>=20){toast("Galerie voll"); break;}
try{
const prompt = p.t+", professional product photography, premium lifestyle, soft natural lighting, swiss luxury brand aesthetic, clean background, high detail, 4k";
const res = await fetch("https://api.openai.com/v1/images/generations",{
method:"POST",
headers:{"Authorization":"Bearer "+STATE.keys.openai,"Content-Type":"application/json"},
body: JSON.stringify({model:"dall-e-3", prompt:prompt, n:1, size:"1024x1024", quality:"standard"})
});
const data = await res.json();
if(data.error) throw new Error(data.error.message||"API Error");
const url = data.data && data.data[0] && data.data[0].url;
if(!url) throw new Error("Keine URL erhalten");
p.gallery.push({bg:"",ki:"DALL-E 3",label:"DALL·E "+(p.gallery.length+1),url:url, generated:Date.now(), rating:0});
ok++;
STATE.costs.today.dalle = (STATE.costs.today.dalle||0) + costPer;
save(); render();
}catch(e){
fail++;
console.error("DALL-E Fehler:",e);
toast("❌ Fehler: "+e.message);
}
}
toast("✅ "+ok+" generiert"+(fail?", "+fail+" fehlgeschlagen":"") );
logActivity("KI-Gen fertig: "+ok+"/"+count+" für "+p.t,"sparkles");
save(); render();
}

function uploadImage(pid,where){
const inp = document.createElement('input');
inp.type='file';
inp.accept='image/*';
inp.multiple = true;
inp.onchange = (e)=>{
const p=STATE.products.find(x=>x.id===pid);
if(!p) return;
ensureImgArrays(p);
const files = Array.from(e.target.files||[]);
files.forEach(f=>{
const reader = new FileReader();
reader.onload = (ev)=>{
const arr = where==='shop'?p.shopImgs:p.gallery;
if(arr.length>=20){toast('Voll (max 20)');return;}
arr.push({url:ev.target.result,ki:'upload'});
if(where==='shop') p.img = p.shopImgs.length;
save();render();
toast('📷 Hochgeladen ('+where+')');
};
reader.readAsDataURL(f);
});
};
inp.click();
}

let _dragData=null;
function dragImage(ev,pid,where,idx){
_dragData={pid,where,idx};
ev.dataTransfer.effectAllowed='move';
}
function dropImage(ev,pid,targetWhere,targetIdx){
ev.preventDefault();
if(!_dragData) return;
if(_dragData.pid!==pid){toast('Nur innerhalb desselben Produkts');return;}
const p=STATE.products.find(x=>x.id===pid);
ensureImgArrays(p);
const srcArr = _dragData.where==='shop'?p.shopImgs:p.gallery;
const tgtArr = targetWhere==='shop'?p.shopImgs:p.gallery;
const img = srcArr.splice(_dragData.idx,1)[0];
if(!img){_dragData=null;return;}
if(typeof targetIdx==='number') tgtArr.splice(targetIdx,0,img);
else tgtArr.push(img);
if(tgtArr.length>20) tgtArr.length=20;
p.img = p.shopImgs.length;
_dragData=null;
save();render();
toast('✨ Bild verschoben');
}

window._carouselIdx = window._carouselIdx || {};
function luxCarousel(p){
  const imgs = (p.shopImgs||[]).filter(function(x){return x && x.url;});
  let idx = window._carouselIdx[p.id] || 0;
  if(idx >= imgs.length) idx = 0;
  const cur = imgs[idx] || null;
  const total = imgs.length;
  const safeTitle = (p.t||'').replace(/'/g,'').replace(/"/g,'');
  return '<div class="lux-carousel">' +
    (cur ? '<img src="'+cur.url+'" loading="lazy" onclick="luxLightbox(\''+cur.url+'\',\''+safeTitle+'\')">' : '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#94a3b8;font-size:48px">📷</div>') +
    (total>1 ? '<button class="nav-btn nav-prev" onclick="luxCarPrev(\''+p.id+'\')">‹</button><button class="nav-btn nav-next" onclick="luxCarNext(\''+p.id+'\')">›</button>' : '') +
    (total>0 ? '<div class="counter">'+(idx+1)+' / '+total+'</div>' : '') +
    (idx===0 && cur ? '<span class="star">★</span>' : '') +
    (total>1 ? '<div class="dots">'+imgs.map(function(_,i){return '<div class="dot'+(i===idx?' active':'')+'"></div>';}).join('')+'</div>' : '') +
    '</div>';
}
function luxCarPrev(pid){
  const p = STATE.products.find(function(x){return x.id===pid;});
  const total = (p.shopImgs||[]).filter(function(x){return x&&x.url;}).length;
  if(total<=0) return;
  window._carouselIdx[pid] = ((window._carouselIdx[pid]||0) - 1 + total) % total;
  rerender();
}
function luxCarNext(pid){
  const p = STATE.products.find(function(x){return x.id===pid;});
  const total = (p.shopImgs||[]).filter(function(x){return x&&x.url;}).length;
  if(total<=0) return;
  window._carouselIdx[pid] = ((window._carouselIdx[pid]||0) + 1) % total;
  rerender();
}

  m.className = 'lux-modal';
  let html = '<div class="panel" style="max-width:560px">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'+
      '<div style="font-size:18px;font-weight:700">📦 Lieferanten</div>'+
      '<button onclick="this.closest(\'.lux-modal\').remove()" style="background:#f1f5f9;width:32px;height:32px;border-radius:8px;font-size:16px">×</button>'+
    '</div>'+
    '<div style="font-size:14px;color:#475569;margin-bottom:14px"><b>'+db.productName+'</b> · Verkaufspreis CHF '+p.p.toFixed(2)+'</div>'+
    marginCompareHtml +
    primaryCard(currentKey, current);

  if(altKeys.length>0){
    html += '<div style="font-size:13px;font-weight:600;color:#64748b;margin:14px 0 8px">Alternativen</div>';
    altKeys.forEach(function(k){ html += altCard(k, db.sources[k]); });
  }

  html += '</div>';
  m.innerHTML = html;
  m.addEventListener('click', function(e){ if(e.target===m) m.remove(); });
  document.body.appendChild(m);
}

function luxConfirmSwitchSupplier(pid, newKey){
  const db = window._SUPPLIER_DB[pid];
  const p = STATE.products.find(function(x){return x.id===pid;});
  if(!db || !p) return;
  const oldKey = _getCurrentSupplier(pid);
  const oldS = db.sources[oldKey];
  const newS = db.sources[newKey];
  function margin(c){ return Math.round((1 - c/p.p)*100); }
  const oldMargin = margin(oldS.price);
  const newMargin = margin(newS.price);
  const priceDiff = newS.price - oldS.price;
  const marginDiff = newMargin - oldMargin;

  // Long shipping warning?
  const newShipMax = parseInt((newS.shipDays||'0').split('-').pop()) || 0;
  const shipWarn = newShipMax > 14;

  const c = document.createElement('div');
  c.className = 'lux-modal';
  c.style.zIndex = 10001;
  c.innerHTML = '<div class="panel" style="max-width:420px">'+
    '<div style="font-size:16px;font-weight:700;margin-bottom:6px">'+(p.t||'')+': Lieferant wechseln zu '+newS.name+'?</div>'+
    '<div style="background:#f8fafc;border-radius:10px;padding:12px;margin:10px 0;font-size:13px">'+
      '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #e2e8f0"><span>Cost:</span><span><b>$'+oldS.price+' → $'+newS.price+'</b> <span style="color:'+(priceDiff<0?'#16a34a':'#dc2626')+'">('+(priceDiff>=0?'+':'')+'$'+priceDiff+')</span></span></div>'+
      '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #e2e8f0"><span>Marge:</span><span><b>'+oldMargin+'% → '+newMargin+'%</b> <span style="color:'+(marginDiff>=0?'#16a34a':'#dc2626')+'">('+(marginDiff>=0?'+':'')+marginDiff+'%)</span></span></div>'+
      '<div style="display:flex;justify-content:space-between;padding:4px 0"><span>Versand:</span><span><b>'+oldS.shipDays+' Tage → '+newS.shipDays+' Tage</b>'+(shipWarn?' ⚠️':'')+'</span></div>'+
    '</div>'+
    (shipWarn ? '<div style="background:#fef3c7;color:#78350f;padding:10px;border-radius:8px;font-size:12px;margin-bottom:10px">⚠️ Kunden warten '+newS.shipDays+' Tage — Lieferzeit im Shop anpassen!</div>' : '')+
    '<div style="display:flex;gap:8px">'+
      '<button id="lux-sw-yes" style="flex:1;padding:12px;background:#a855f7;color:#fff;border-radius:10px;font-weight:600">✓ Ja, wechseln</button>'+
      '<button onclick="this.closest(\'.lux-modal\').remove()" style="flex:1;padding:12px;background:#f1f5f9;border-radius:10px">Abbrechen</button>'+
    '</div></div>';
  document.body.appendChild(c);
  document.getElementById('lux-sw-yes').onclick = function(){
    // Apply switch
    const prevChoice = oldKey;
    window._supplierChoice[pid] = newKey;
    _saveSupplierChoice();
    p.sup = newS.name;
    p.cost = newS.price;
    p.supplierUrl = newS.url;
    db.primary = newKey;
    if(typeof logActivity==='function'){
      try{ logActivity({text:'🔄 Lieferant gewechselt: '+p.t+' → '+newS.name+' ($'+oldS.price+'→$'+newS.price+')', icon:'sparkles', linkType:'product', linkId:pid}); }catch(e){}
    }
    c.remove();
    // Refresh supplier modal if open
    document.querySelectorAll('.lux-modal').forEach(function(m){m.remove();});
    luxToast('✅ Gewechselt zu '+newS.name, function(){
      // Undo
      window._supplierChoice[pid] = prevChoice;
      _saveSupplierChoice();
      p.sup = oldS.name;
      p.cost = oldS.price;
      p.supplierUrl = oldS.url;
      db.primary = prevChoice;
      rerender();
      luxToast('↩ Wechsel rückgängig gemacht', null);
    });
    if(shipWarn){
      setTimeout(function(){
        luxToast('⚠️ '+newS.shipDays+' Tage Versand — Lieferzeit im Shop anpassen?', null);
      }, 5500);
    }
    rerender();
    // Re-open supplier modal to show new layout
    setTimeout(function(){ luxSupplierModal(pid); }, 400);
  };
}

// Patch renderProductCard to add Lieferanten button
(function patchSupplierButton(){
  if(typeof window.renderProductCard !== 'function') return;
  const _origCard = window.renderProductCard;
  window.renderProductCard = function(p){
    let html = _origCard.call(this, p);
    // Inject "📦 Lieferanten" button next to existing Lieferant link button
    // Find the supplier action row (it has a button with onclick window.open + supplierUrl)
    const btn = '<button onclick="luxSupplierModal(\''+p.id+'\')" class="text-[11px] bg-purple-600 text-white px-2 py-1 rounded" style="cursor:pointer">📦 Lieferanten</button>';
    // Insert after the existing 🔗 Lieferant button (if exists), else just before the bilder section
    const marker = '🔗 Lieferant</button>';
    if(html.indexOf(marker) >= 0){
      html = html.replace(marker, marker + btn);
    } else {
      // Fallback: add into the actions row
      html = html.replace('<div class="flex gap-1.5 mt-2 flex-wrap">', '<div class="flex gap-1.5 mt-2 flex-wrap">'+btn);
    }
    return html;
  };
})();

setTimeout(rerender, 200);

}catch(__p4err){console.error("[Phase4 Patch error]", __p4err);}
/* === PHASE 4 PATCH END === */

init();
</script>
