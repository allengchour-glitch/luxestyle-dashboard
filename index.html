async function generateKI(pid,count){
  const p=STATE.products.find(x=>x.id===pid);
  if(!p) return;
  ensureImgArrays(p);
  count = count || 3;
  if(!STATE.keys.openai){
    toast("⚠️ Kein OpenAI Key — bitte in Setup ⚙️ eintragen");
    openSetup(); return;
  }
  const costPer = 0.04; // dall-e-3 standard ~$0.04
  const cost = (count*costPer).toFixed(2);
  if(!confirm("DALL·E 3: "+count+" Bild(er) für "+p.name+"\n≈ $"+cost+" Kosten. Fortfahren?")) return;
  toast("🎨 Generiere "+count+" Bild(er) via DALL·E 3…");
  logActivity("KI-Gen Start: "+count+" für "+p.name,"sparkles");
  let ok=0, fail=0;
  for(let i=0;i<count;i++){
    if(p.gallery.length>=20){toast("Galerie voll"); break;}
    try{
      const prompt = p.name+", professional product photography, premium lifestyle, soft natural lighting, swiss luxury brand aesthetic, clean background, high detail, 4k";
      const res = await fetch("https://api.openai.com/v1/images/generations",{
        method:"POST",
        headers:{"Authorization":"Bearer "+STATE.keys.openai,"Content-Type":"application/json"},
        body: JSON.stringify({model:"dall-e-3", prompt:prompt, n:1, size:"1024x1024", quality:"standard"})
      });
      const data = await res.json();
      if(data.error) throw new Error(data.error.message||"API Error");
      const url = data.data && data.data[0] && data.data[0].url;
      if(!url) throw new Error("Keine URL erhalten");
      p.gallery.push({bg:"",ki:"DALL-E 3",label:"DALL·E "+(p.gallery.length+1),url:url, generated:Date.now(), rating:0});
      ok++;
      STATE.costs.today.dalle = (STATE.costs.today.dalle||0) + costPer;
      save(); render();
    }catch(e){
      fail++;
      console.error("DALL-E Fehler:",e);
      toast("❌ Fehler: "+e.message);
    }
  }
  toast("✅ "+ok+" generiert"+(fail?", "+fail+" fehlgeschlagen":"") );
  logActivity("KI-Gen fertig: "+ok+"/"+count+" für "+p.name,"sparkles");
  save(); render();
}

function uploadImage(pid,where){

    const p=STATE.products.find(x=>x.id===pid);
    if(!p) return;
    ensureImgArrays(p);
    const files = Array.from(e.target.files||[]);
    files.forEach(f=>{
      const reader = new FileReader();
      reader.onload = (ev)=>{
        const arr = where==='shop'?p.shopImgs:p.gallery;
        if(arr.length>=20){toast('Voll (max 20)');return;}
        arr.push({url:ev.target.result,ki:'upload'});
        if(where==='shop') p.img = p.shopImgs.length;
        save();render();
        toast(`📷 Hochgeladen (${where})`);
      };
      reader.readAsDataURL(f);
    });
  };
  inp.click();
}

// Drag & Drop
let _dragData=null;
function dragImage(ev,pid,where,idx){
  _dragData={pid,where,idx};
  ev.dataTransfer.effectAllowed='move';
}
function dropImage(ev,pid,targetWhere,targetIdx){
  ev.preventDefault();
  if(!_dragData) return;
  if(_dragData.pid!==pid){toast('Nur innerhalb desselben Produkts');return;}
  const p=STATE.products.find(x=>x.id===pid);
  ensureImgArrays(p);
  const srcArr = _dragData.where==='shop'?p.shopImgs:p.gallery;
  const tgtArr = targetWhere==='shop'?p.shopImgs:p.gallery;
  const img = srcArr.splice(_dragData.idx,1)[0];
  if(!img){_dragData=null;return;}
  if(typeof targetIdx==='number') tgtArr.splice(targetIdx,0,img);
  else tgtArr.push(img);
  if(tgtArr.length>20) tgtArr.length=20;
  p.img = p.shopImgs.length;
  _dragData=null;
  save();render();
  toast(`✨ ${_dragData?_dragData.where:''} → ${targetWhere}`);
}


// ========== Phase 1.5: Ads + Pipeline + Shop-Link ==========
function openShopProduct(pid){
  const p=STATE.products.find(x=>x.id===pid);
  if(!p) return;
  const slug=(p.t||"").toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  const url=(STATE.shop.primaryDomain||"")+"/products/"+slug;
  window.open(url,"_blank");
}

function previewAd(p){toast('👁️ Vorschau — Phase 3 zeigt echte Creatives');}
function regenAd(p){if(!confirm('Neue Ad-Variante generieren für '+p+'?\n(Phase 3 nutzt KI für Text+Bild)'))return; toast('🔄 Wird in Phase 3 aktiv'); logActivity('Ad-Regen: '+p,'sparkles');}
function topupBudget(p){
  const urls={meta:'https://business.facebook.com/billing_hub',google:'https://ads.google.com/aw/billing',tiktok:'https://ads.tiktok.com/i18n/account/payment'};
  if(confirm('Öffnet '+p+' Billing in neuem Tab.\nGeld einzahlen musst du selbst tun.')){window.open(urls[p],'_blank');}

function renderPipeline(){
  const products=STATE.products||[];
  const stages=[
    {key:'idea',name:'Idee',icon:'lightbulb',test:p=>true},
    {key:'images',name:'Bilder',icon:'image',test:p=>(p.shopImgs&&p.shopImgs.length>0)||(p.gallery&&p.gallery.length>0)},
    {key:'shop',name:'Im Shop',icon:'store',test:p=>p.status!=='draft'&&p.shopImgs&&p.shopImgs.length>0},
    {key:'ads',name:'Ads Live',icon:'target',test:p=>p.adsReady||p.adsLive},
    {key:'sales',name:'Verkauf',icon:'shopping-cart',test:p=>(p.sold||0)>0}
  ];
  const counts=stages.map(s=>products.filter(s.test).length);
  let html='<div class="space-y-4">';
  html+='<div class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white p-4 rounded-xl"><h2 class="font-bold text-lg flex items-center gap-2"><i data-lucide="git-branch" class="w-5 h-5"></i> Pipeline</h2><p class="text-sm opacity-90 mt-1">Produkt-Workflow: Idee → Verkauf</p></div>';
  html+='<div class="bg-white rounded-xl shadow-sm p-4 overflow-x-auto"><div class="flex items-center gap-1 min-w-max">';
  for(let i=0;i<stages.length;i++){
    const s=stages[i];
    html+='<div class="flex flex-col items-center text-center min-w-[80px]">';
    html+='<div class="w-14 h-14 rounded-full bg-gradient-to-br from-purple-100 to-pink-100 flex items-center justify-center mb-2 relative">';
    html+='<i data-lucide="'+s.icon+'" class="w-6 h-6 text-purple-600"></i>';
    html+='<div class="absolute -top-1 -right-1 bg-purple-600 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center">'+counts[i]+'</div></div>';
    html+='<div class="text-xs font-medium">'+s.name+'</div></div>';
    if(i<stages.length-1) html+='<div class="flex-1 min-w-[20px] h-0.5 bg-gradient-to-r from-purple-300 to-pink-300 mt-[-20px]"></div>';
  }
  html+='</div></div>';
  for(let i=0;i<stages.length;i++){
    const s=stages[i];
    const prods=products.filter(s.test);
    html+='<div class="bg-white rounded-xl shadow-sm p-3"><h3 class="font-bold text-sm mb-2 flex items-center gap-2"><i data-lucide="'+s.icon+'" class="w-4 h-4 text-purple-600"></i> '+s.name+' ('+prods.length+')</h3>';
    if(prods.length===0){html+='<div class="text-xs text-slate-400">Keine Produkte hier</div>';}
    else{
      html+='<div class="space-y-1">';
      for(let j=0;j<Math.min(prods.length,5);j++){
        const p=prods[j];
        html+='<div class="flex justify-between items-center text-xs p-2 bg-slate-50 rounded"><div class="flex items-center gap-2 truncate"><span class="font-medium truncate">'+p.t+'</span><span class="text-slate-400 text-[10px]">CHF '+p.p+'</span></div>';
        html+='<button onclick="openShopProduct(\''+p.id+'\')" class="text-purple-600 text-[10px]"><i data-lucide="external-link" class="w-3 h-3 inline"></i></button></div>';
      }
      if(prods.length>5) html+='<div class="text-[10px] text-slate-400 text-center">+ '+(prods.length-5)+' weitere</div>';
      html+='</div>';
    }
    html+='</div>';
  }
  let hint='';
  if(counts[1]===0) hint='KI-Bilder generieren — kein Produkt hat Bilder!';
  else if(counts[2]<counts[1]) hint='Produkte in Shop publizieren ('+(counts[1]-counts[2])+' bereit).';
  else if(counts[3]<counts[2]) hint='Ads für '+(counts[2]-counts[3])+' Shop-Produkte starten.';
  else hint='✅ Alle Produkte in der Verkaufsphase!';
  html+='<div class="bg-blue-50 border border-blue-200 rounded-lg p-3 text-xs text-blue-900"><b>💡 Nächster Schritt:</b> '+hint+'</div>';
  html+='</div>';
  $('app').innerHTML=html;
}

function bulkGenerate(){
const cat=STATE.settings.shopCategory;
const products=STATE.products.filter(p=>p.cat===cat);
const cost=products.length*6*0.04;
if(!confirm(`6 KI-Bilder für ${products.length} ${cat}-Produkte generieren?\nKosten: ~$${cost.toFixed(2)}`))return;
toast(`🎨 ${products.length*6} Bilder werden generiert...`);
STATE.costs.today.dalle+=cost;save();
logActivity(`Bulk: ${products.length*6} KI-Bilder ($${cost.toFixed(2)})`,'sparkles');
sendDiscord(`🎨 Bulk-Generation: ${products.length*6} Bilder\nKosten: $${cost.toFixed(2)}`);
setTimeout(()=>render(),1500);
}

// ========== INTEGRATIONS ==========
async function sendDiscord(msg){
if(!STATE.keys.discord)return;
try{
await fetch(STATE.keys.discord,{
method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({content:`**[LuxeStyle Dashboard]** ${msg}`})
});
}catch(e){console.error('Discord error:',e)}
}

async function sendChat(){
const input=$('chat-input');
const msg=input.value.trim();
if(!msg)return;
if(!STATE.keys.gemini){toast('Gemini Key fehlt');return}
const msgs=$('chat-msgs');
msgs.innerHTML+=`<div class="bg-purple-50 p-2 rounded text-sm"><b>Du:</b> ${msg}</div>`;
input.value='';
msgs.innerHTML+=`<div id="thinking" class="bg-slate-50 p-2 rounded text-sm text-slate-500 pulse-soft">💭 Gemini denkt...</div>`;
msgs.scrollTop=msgs.scrollHeight;
try{
const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${STATE.keys.gemini}`,{
method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({contents:[{parts:[{text:`Du bist ein E-Commerce-Berater für einen Schweizer Dropshipping-Shop (LuxeStyle CH). Antworte kurz, konkret, auf Deutsch. Frage: ${msg}`}]}]})
});
const data=await res.json();
const answer=data.candidates?.[0]?.content?.parts?.[0]?.text||'Fehler';
$('thinking').remove();
msgs.innerHTML+=`<div class="bg-slate-50 p-2 rounded text-sm"><b>Gemini:</b> ${answer}</div>`;
msgs.scrollTop=msgs.scrollHeight;
}catch(e){$('thinking').textContent='❌ Fehler: '+e.message}
}
