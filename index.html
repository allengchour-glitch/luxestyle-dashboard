function $(id){return document.getElementById(id)}
function toast(msg,t=2500){const el=$('toast');el.textContent=msg;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),t)}
function save(){localStorage.setItem('luxe_keys',JSON.stringify(STATE.keys));localStorage.setItem('luxe_settings',JSON.stringify(STATE.settings));localStorage.setItem('luxe_costs',JSON.stringify(STATE.costs));localStorage.setItem('luxe_activity',JSON.stringify(STATE.activity.slice(0,20)))}

function render(){const app=$('app');app.classList.remove('fade-in');void app.offsetWidth;app.classList.add('fade-in');const fn={cockpit:renderCockpit,shop:renderShop,ki:renderKI,marketing:renderMarketing,stats:renderStats,mehr:renderMehr}[STATE.tab];fn();lucide.createIcons()}

<label class="text-xs font-medium text-slate-700">📧 Klaviyo Public Key</label>
<input id="k-klaviyo" type="text" value="${STATE.keys.klaviyo||''}" placeholder="ABC123" class="w-full border rounded-lg px-3 py-2 text-sm mt-1">
<p class="text-xs text-slate-400 mt-1">Klaviyo → Account → API Keys</p>
</div>

<div>
<label class="text-xs font-medium text-slate-700">💬 Discord Webhook URL</label>
<input id="k-discord" type="text" value="${STATE.keys.discord||''}" placeholder="https://discord.com/api/webhooks/..." class="w-full border rounded-lg px-3 py-2 text-sm mt-1">
<p class="text-xs text-slate-400 mt-1">Discord Server → Channel → Integrationen → Webhook</p>
</div>

<div>
<label class="text-xs font-medium text-slate-700">🛒 Shopify Admin Token (optional)</label>
<input id="k-shopify" type="password" value="${STATE.keys.shopify||''}" placeholder="shpat_..." class="w-full border rounded-lg px-3 py-2 text-sm mt-1">
<p class="text-xs text-slate-400 mt-1">Apps → Develop Apps → Create Custom App</p>
</div>

<button onclick="saveKeys()" class="w-full bg-green-600 text-white py-3 rounded-lg font-medium">💾 Alle Keys speichern</button>
`;
$('setup-modal').classList.remove('hidden');
$('setup-modal').classList.add('flex');
lucide.createIcons();
}

function closeSetup(){$('setup-modal').classList.add('hidden');$('setup-modal').classList.remove('flex')}

function saveKeys(){
STATE.keys.heygen=$('k-heygen').value.trim();
STATE.keys.openai=$('k-openai').value.trim();
STATE.keys.gemini=$('k-gemini').value.trim();
STATE.keys.klaviyo=$('k-klaviyo').value.trim();
STATE.keys.discord=$('k-discord').value.trim();
STATE.keys.shopify=$('k-shopify').value.trim();
save();
closeSetup();
toast('✅ Keys gespeichert!');
logActivity('Setup vervollständigt','check-circle');
render();
}

// ========== ACTIONS ==========
function runAutoPilot(){
const adsReady=STATE.products.filter(p=>p.adsReady);
if(adsReady.length===0){toast('⚠️ Keine Ads-Ready Produkte');return}
if(!STATE.keys.heygen){toast('⚠️ HeyGen Key fehlt - öffne Setup');openSetup();return}
toast(`🚀 Auto-Run startet für ${adsReady.length} Produkte...`);
logActivity(`Auto-Run gestartet (${adsReady.length} Produkte)`,'zap');
sendDiscord(`🚀 Auto-Run gestartet!\n${adsReady.length} Produkte bereit für KI-Generierung`);
setTimeout(()=>{logActivity('HeyGen Video für Herrenuhr OK ✓','video');STATE.costs.today.heygen+=1.20;save();render()},2000);
setTimeout(()=>{logActivity('5 KI-Bilder generiert ✓','image');STATE.costs.today.dalle+=0.20;save();render()},4000);
}

function addImageSlot(pid,slot){
const p=STATE.products.find(x=>x.id===pid);
if(p.img>=5){toast('Max 5 Slots erreicht');return}
p.img++;save();render();toast('✅ Slot hinzugefügt');logActivity(`Bild zu ${p.t} hinzugefügt`,'image');
}

function kiImageOptions(pid,idx){
const choice=prompt('Was machen?\n1 = ➕ Zu Shop hinzufügen\n2 = 🔄 Neu generieren ($0.04)\n3 = 🗑️ Löschen\n\nGib 1, 2 oder 3 ein:');
if(choice==='1'){addImageSlot(pid,idx)}
else if(choice==='2'){
if(!STATE.keys.openai){toast('⚠️ OpenAI Key fehlt');openSetup();return}
STATE.costs.today.dalle+=0.04;save();toast('🎨 Neu generiert ($0.04)');logActivity('KI-Bild neu generiert','sparkles')}
else if(choice==='3'){toast('🗑️ Bild gelöscht')}
}

function generateVideo(pid){
const p=STATE.products.find(x=>x.id===pid);
if(!STATE.keys.heygen){toast('⚠️ HeyGen Key fehlt');openSetup();return}
toast(`🎬 Video für ${p.t} wird generiert...`);
STATE.costs.today.heygen+=1.20;save();
logActivity(`HeyGen Video: ${p.t}`,'video');
sendDiscord(`🎬 Neues Video generiert: ${p.t}`);
setTimeout(()=>render(),1000);
}

function openSupplier(pid){
const p=STATE.products.find(x=>x.id===pid);
if(p.supUrl){window.open(p.supUrl,'_blank')}
else{const url=prompt(`Lieferant-URL für ${p.t}:`,'');if(url){p.supUrl=url;save();toast('✅ URL gespeichert');render()}}
}

function swapProduct(pid){
const p=STATE.products.find(x=>x.id===pid);
const ideas=STATE.poolIdeas.slice(0,5).map((i,n)=>`${n+1}. ${i.name} (Marge ${i.margin}%)`).join('\n');
const choice=prompt(`Tausche ${p.t} gegen:\n\n${ideas}\n\nNummer (1-5) oder 0=abbrechen:`);
const n=parseInt(choice);
if(n>=1&&n<=5){
const idea=STATE.poolIdeas[n-1];
toast(`🔄 Tausch: ${p.t} → ${idea.name}`);
logActivity(`Tausch: ${p.t} → ${idea.name}`,'refresh-cw');
p.t=idea.name;p.p=idea.price;p.c=idea.cost;p.pipe='DRAFT';p.adsReady=false;
save();render();
}
}

function activatePoolIdea(id){
const idea=STATE.poolIdeas.find(i=>i.id===id);
if(!confirm(`"${idea.name}" als neues Produkt aktivieren?\nKI wird in 2 Min Bilder + SEO erstellen.`))return;
toast(`✨ ${idea.name} wird aktiviert...`);
logActivity(`Pool-Idee aktiviert: ${idea.name}`,'star');
sendDiscord(`✨ Neues Produkt: ${idea.name}\nPreis: CHF ${idea.price} · Marge ${idea.margin}%`);
}

function bulkGenerate(){
const cat=STATE.settings.shopCategory;
const products=STATE.products.filter(p=>p.cat===cat);
const cost=products.length*6*0.04;
if(!confirm(`6 KI-Bilder für ${products.length} ${cat}-Produkte generieren?\nKosten: ~$${cost.toFixed(2)}`))return;
toast(`🎨 ${products.length*6} Bilder werden generiert...`);
STATE.costs.today.dalle+=cost;save();
logActivity(`Bulk: ${products.length*6} KI-Bilder ($${cost.toFixed(2)})`,'sparkles');
sendDiscord(`🎨 Bulk-Generation: ${products.length*6} Bilder\nKosten: $${cost.toFixed(2)}`);
setTimeout(()=>render(),1500);
}

// ========== INTEGRATIONS ==========
async function sendDiscord(msg){
if(!STATE.keys.discord)return;
try{
await fetch(STATE.keys.discord,{
method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({content:`**[LuxeStyle Dashboard]** ${msg}`})
});
}catch(e){console.error('Discord error:',e)}
}

async function sendChat(){
const input=$('chat-input');
const msg=input.value.trim();
if(!msg)return;
if(!STATE.keys.gemini){toast('Gemini Key fehlt');return}
const msgs=$('chat-msgs');
msgs.innerHTML+=`<div class="bg-purple-50 p-2 rounded text-sm"><b>Du:</b> ${msg}</div>`;
input.value='';
msgs.innerHTML+=`<div id="thinking" class="bg-slate-50 p-2 rounded text-sm text-slate-500 pulse-soft">💭 Gemini denkt...</div>`;
msgs.scrollTop=msgs.scrollHeight;
try{
const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${STATE.keys.gemini}`,{
method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({contents:[{parts:[{text:`Du bist ein E-Commerce-Berater für einen Schweizer Dropshipping-Shop (LuxeStyle CH). Antworte kurz, konkret, auf Deutsch. Frage: ${msg}`}]}]})
});
const data=await res.json();
const answer=data.candidates?.[0]?.content?.parts?.[0]?.text||'Fehler';
$('thinking').remove();
msgs.innerHTML+=`<div class="bg-slate-50 p-2 rounded text-sm"><b>Gemini:</b> ${answer}</div>`;
msgs.scrollTop=msgs.scrollHeight;
}catch(e){$('thinking').textContent='❌ Fehler: '+e.message}
}

// ========== INIT ==========
function init(){
lucide.createIcons();
switchTab('cockpit');
const firstRun=!localStorage.getItem('luxe_init');
if(firstRun){
localStorage.setItem('luxe_init','1');
logActivity('Dashboard v8 erstmalig gestartet','sparkles');
setTimeout(()=>{
toast('👋 Willkommen Allen! Öffne ⚙️ oben rechts für Setup',5000);
},800);
}
}
init();
</script>
</body>
</html>
