#:schema node_modules/wrangler/config-schema.json
# Wrangler-Config fuer den aban-news Worker (Anmeldung/Double-Opt-in/Referral).
# Deploy: siehe deploy/README.md  ->  npm run deploy
name = "aban-subscribe"
main = "../aban-cloudflare-worker.js"
compatibility_date = "2024-11-01"
workers_dev = true

# KV: ID wird beim Setup eingetragen (npm run kv:create gibt sie aus).
kv_namespaces = [
  { binding = "ABAN_SUBS", id = "REPLACE_WITH_KV_ID" }
]

# Routen auf der eigenen Domain. Erfordert, dass abannews.com als Cloudflare-Zone aktiv ist.
# Vor dem ersten Deploy ggf. auskommentieren und nur ueber *.workers.dev testen.
routes = [
  { pattern = "abannews.com/subscribe", zone_name = "abannews.com" },
  { pattern = "abannews.com/confirm",   zone_name = "abannews.com" },
  { pattern = "abannews.com/status",    zone_name = "abannews.com" },
  { pattern = "abannews.com/abmelden",  zone_name = "abannews.com" },
  { pattern = "abannews.com/export",    zone_name = "abannews.com" },
]

# Oeffentliche Variablen (keine Secrets!). Secrets via `wrangler secret put` (siehe README).
# MUSS am Ende stehen: alles nach einem [table]-Header gehoert zu dieser Tabelle.
[vars]
SITE = "https://abannews.com"
