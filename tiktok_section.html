<!--
  TikTok-Section Component für Dashboard v9.2

  USAGE:
  1. Diesen Block irgendwo in index.html (innerhalb <div class="container">) einfügen
  2. Sicherstellen dass tiktok_videos.json im selben Ordner liegt
     ODER Pfad in fetch() unten anpassen
  3. Falls JSON in einem anderen Repo: Symlink ODER Build-Step
-->

<section class="section" id="tiktok-section">
  <div class="section-header">
    <div>
      <div class="section-subtitle">CONTENT · TIKTOK</div>
      <div class="section-title">Video-Pipeline</div>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn-render" id="tt-filter-all" onclick="ttFilter('all')">Alle</button>
      <button class="btn-render" id="tt-filter-scripted" onclick="ttFilter('scripted')">Scripted</button>
      <button class="btn-render" id="tt-filter-live" onclick="ttFilter('live')">Live</button>
    </div>
  </div>

  <div id="tiktok-stats" class="kpi-grid" style="margin-bottom:12px;">
    <div class="kpi">
      <div class="kpi-label">Scripts</div>
      <div class="kpi-value" id="tt-stat-scripts">—</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Live Videos</div>
      <div class="kpi-value" id="tt-stat-live">—</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Total Views</div>
      <div class="kpi-value" id="tt-stat-views">—</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Hot Schedule</div>
      <div class="kpi-value" id="tt-stat-next" style="font-size:14px;">—</div>
    </div>
  </div>

  <div id="tiktok-grid" class="product-grid">
    <!-- Cards werden dynamisch eingefügt -->
    <div style="grid-column:1/-1; text-align:center; color:var(--text-tertiary); padding:24px;">Lade tiktok_videos.json…</div>
  </div>
</section>

<style>
.btn-render {
  background: transparent;
  border: 0.5px solid var(--border);
  color: var(--text-secondary);
  padding: 6px 14px;
  border-radius: 100px;
  font-size: 12px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}
.btn-render:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.btn-render.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.tt-card {
  background: var(--bg-card);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.tt-status {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 100px;
  font-size: 10px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  font-weight: 500;
}
.tt-status.scripted { background: rgba(239, 159, 39, 0.12); color: var(--warning); }
.tt-status.in_production { background: rgba(55, 138, 221, 0.12); color: var(--info); }
.tt-status.live { background: rgba(29, 158, 117, 0.12); color: var(--success); }
.tt-status.archived { background: rgba(138, 138, 138, 0.12); color: var(--text-tertiary); }
.tt-title {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 16px;
  line-height: 1.3;
  color: var(--text-primary);
}
.tt-handle {
  font-size: 11px;
  letter-spacing: 1px;
  color: var(--accent);
  text-transform: uppercase;
}
.tt-meta {
  display: flex;
  gap: 12px;
  font-size: 11px;
  color: var(--text-tertiary);
}
.tt-actions {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  flex-wrap: wrap;
}
.tt-actions a, .tt-actions button {
  background: transparent;
  border: 0.5px solid var(--border);
  color: var(--text-secondary);
  padding: 5px 10px;
  border-radius: 4px;
  font-size: 11px;
  cursor: pointer;
  text-decoration: none;
  font-family: inherit;
}
.tt-actions a:hover, .tt-actions button:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.tt-actions a.disabled {
  opacity: 0.4;
  pointer-events: none;
}
</style>

<script>
(function() {
  let allVideos = [];
  let currentFilter = 'all';

  async function loadTikTokVideos() {
    try {
      // Pfad anpassen falls JSON woanders liegt
      const r = await fetch('tiktok_videos.json');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      allVideos = data.videos || [];
      updateStats(data);
      renderGrid();
    } catch (e) {
      console.warn('TikTok-Videos-Load failed:', e);
      // Fallback: zeige hardcoded Demo-Daten
      allVideos = [
        {id: 'demo-1', product_handle: 'galaxy-aurora-led-projektor', title: 'Schlaflos? Diese LED-Galaxie hilft 🌌', status: 'scripted', duration_seconds: 28, metrics: {views: 0}},
        {id: 'demo-2', product_handle: 'himalaya-salzkristall-lampe', title: 'Echtes Himalaya. Echtes Wohlfühlen.', status: 'scripted', duration_seconds: 28, metrics: {views: 0}},
        {id: 'demo-3', product_handle: 'mini-robo-diffuser', title: 'Mein Schreibtisch-Buddy ist süsser 🤖', status: 'scripted', duration_seconds: 28, metrics: {views: 0}},
      ];
      updateStats({_pipeline_status: {scripts_written: 3, videos_live: 0, total_views_lifetime: 0}, _post_schedule: {'demo-1': 'Mittwoch 19:00'}});
      renderGrid();
    }
  }

  function updateStats(data) {
    const scripted = allVideos.filter(v => v.status === 'scripted').length;
    const live = allVideos.filter(v => v.status === 'live').length;
    const totalViews = allVideos.reduce((s, v) => s + (v.metrics?.views || 0), 0);
    document.getElementById('tt-stat-scripts').textContent = scripted;
    document.getElementById('tt-stat-live').textContent = live;
    document.getElementById('tt-stat-views').textContent = totalViews.toLocaleString('de-CH');
    // Find next scheduled video (simplified)
    const sched = data._post_schedule || {};
    const next = Object.values(sched)[0] || '—';
    document.getElementById('tt-stat-next').textContent = next;
  }

  function renderGrid() {
    const grid = document.getElementById('tiktok-grid');
    const filtered = currentFilter === 'all' ? allVideos : allVideos.filter(v => v.status === currentFilter);
    if (filtered.length === 0) {
      grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:var(--text-tertiary); padding:24px;">Keine Videos in dieser Kategorie.</div>';
      return;
    }
    grid.innerHTML = filtered.map(v => `
      <div class="tt-card">
        <span class="tt-status ${v.status}">${v.status}</span>
        <div class="tt-handle">${v.product_handle}</div>
        <div class="tt-title">${v.title}</div>
        <div class="tt-meta">
          <span>⏱ ${v.duration_seconds || 0}s</span>
          <span>👁 ${(v.metrics?.views || 0).toLocaleString('de-CH')}</span>
          <span>♥ ${v.metrics?.likes || 0}</span>
        </div>
        <div class="tt-actions">
          <a href="${v.tiktok_url || '#'}" class="${!v.tiktok_url ? 'disabled' : ''}" target="_blank">TikTok ▶</a>
          <a href="${v.instagram_reels_url || '#'}" class="${!v.instagram_reels_url ? 'disabled' : ''}" target="_blank">Reels ▶</a>
          <a href="${v.youtube_shorts_url || '#'}" class="${!v.youtube_shorts_url ? 'disabled' : ''}" target="_blank">Shorts ▶</a>
          <a href="https://luxestyle.com.co/products/${v.product_handle}" target="_blank">🇨🇭 Shop</a>
        </div>
      </div>
    `).join('');
  }

  window.ttFilter = function(filter) {
    currentFilter = filter;
    ['all', 'scripted', 'live'].forEach(f => {
      document.getElementById('tt-filter-' + f)?.classList.toggle('active', f === filter);
    });
    renderGrid();
  };

  // Init
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('tt-filter-all')?.classList.add('active');
    loadTikTokVideos();
  });
  // Falls bereits geladen
  if (document.readyState !== 'loading') {
    document.getElementById('tt-filter-all')?.classList.add('active');
    loadTikTokVideos();
  }
})();
</script>
