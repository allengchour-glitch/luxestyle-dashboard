name: aban — Worker deploy

# Deployt den Anmelde-/Referral-Worker automatisch nach Cloudflare.
# DEINE Aufgabe = nur Secrets setzen + hier auf "Run workflow" tippen. Der Rest laeuft.
#
# Benoetigte GitHub-Secrets (Repo -> Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   Token mit "Edit Cloudflare Workers" + Zone DNS Edit (Zone abannews.com)
#   CLOUDFLARE_ACCOUNT_ID  deine Cloudflare Account-ID (Dashboard -> Workers -> rechts)
#   UNSUB_SECRET           dein Geheimnis (gleich wie ueberall)
#   RESEND_API_KEY         aus dem Resend-Konto
#   MAIL_FROM              z.B.  aban news <news@abannews.com>
#   ADMIN_KEY              zweites Geheimnis fuer /export
#
# Danach: Actions -> "aban — Worker deploy" -> Run workflow. Fertig.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: content/aban/deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Wrangler installieren
        run: npm install
      - name: Worker deployen (KV + Secrets + Custom Domain)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: bash ci-deploy.sh
